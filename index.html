<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>幼少期アバター育成 Pro Max</title>
  <style>
    /* 全体設定 */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 16px; display: flex; justify-content: center; }
    .app-container { max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 14px; padding-bottom: 40px; }
    .card { background: #1e293b; border-radius: 20px; padding: 18px; border: 1px solid #334155; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
    h2 { font-size: 15px; margin-bottom: 12px; color: #38bdf8; display: flex; align-items: center; justify-content: space-between; }
    
    /* アバター表示 */
    .avatar-card { text-align: center; background: radial-gradient(circle at 50% 0%, #1e293b, #0f172a); border: 2px solid #38bdf8; position: relative; }
    .avatar-box { width: 140px; height: 140px; border-radius: 50%; background: #000; margin: 0 auto 12px; overflow: hidden; border: 4px solid #38bdf8; display: flex; align-items: center; justify-content: center; position: relative; box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
    #avatarImg { width: 100%; height: 100%; object-fit: cover; }
    .level-badge { position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); background: #38bdf8; color: #0f172a; font-weight: 900; font-size: 12px; padding: 4px 12px; border-radius: 12px; white-space: nowrap; z-index: 10; }
    
    .char-name { font-size: 20px; font-weight: bold; margin-top: 10px; color: #fff; }
    .char-desc { font-size: 12px; color: #94a3b8; margin-top: 6px; line-height: 1.4; padding: 0 10px; }

    /* 入力エリア */
    input[type="password"], input[type="text"] { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #475569; background: #030712; color: white; font-size: 14px; outline: none; margin-bottom: 10px; }
    button { width: 100%; padding: 16px; background: #38bdf8; color: #0f172a; border: none; border-radius: 14px; font-weight: 800; cursor: pointer; font-size: 14px; transition: 0.2s; box-shadow: 0 4px 0 #0284c7; }
    button:active { transform: translateY(2px); box-shadow: none; }
    button:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    
    .chat-box { background: #030712; border-radius: 16px; padding: 15px; min-height: 80px; font-size: 15px; line-height: 1.6; color: #e5e7eb; border: 1px solid #1f2937; position: relative; margin-top: 15px; }
    .voice-btn { width: auto; padding: 6px 12px; font-size: 11px; background: #6366f1; border-radius: 8px; color: white; border: none; cursor: pointer; float: right; margin-top: 8px; box-shadow: 0 3px 0 #4338ca; }
    
    /* ログ表示エリア */
    .history-list { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .history-item { background: #0f172a; border-radius: 8px; padding: 10px; font-size: 12px; border-left: 3px solid #38bdf8; }
    .history-user { color: #94a3b8; font-weight: bold; margin-bottom: 2px; }

    #previewArea { display: none; margin-bottom: 10px; text-align: center; }
    #previewImg { width: 100%; max-height: 150px; object-fit: contain; border-radius: 12px; border: 1px dashed #38bdf8; }
    .status-msg { font-size: 10px; color: #64748b; text-align: center; margin-top: 8px; min-height: 1.2em; }
    .reset-btn { background: transparent; color: #ef4444; border: none; font-size: 11px; box-shadow: none; padding: 5px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- API設定 -->
  <div class="card">
    <input type="password" id="apiKey" placeholder="Gemini API Key を入力" />
    <div id="statusMsg" class="status-msg">写真を選んでね！</div>
  </div>

  <!-- 写真アップロード -->
  <div class="card" id="setupCard">
    <h2>📸 写真からアバターを生成</h2>
    <div id="previewArea">
      <img id="previewImg" alt="元画像" />
    </div>
    <!-- accept="image/*" だけでiPhoneのカメラ・ライブラリ両方対応できます -->
    <input type="file" id="photoInput" accept="image/*" style="display:none;" onchange="handlePhoto(event)" />
    <button onclick="document.getElementById('photoInput').click()">📷 写真を撮影・選択</button>
    <button id="analyzeBtn" onclick="startPhotoAnalysis()" style="display:none; margin-top:10px; background:#10b981; box-shadow:0 4px 0 #047857;">✨ アバターを誕生させる</button>
  </div>

  <!-- アバター表示 -->
  <div class="card avatar-card">
    <div class="avatar-box">
      <img id="avatarImg" src="https://image.pollinations.ai/prompt/cute%20anime%20child%20avatar%20silhouette?width=300&height=300&nologo=true" alt="アバター" />
      <div class="level-badge" id="levelBadge">Lv.1 (未設定)</div>
    </div>
    <div class="char-name" id="charName">アバター未設定</div>
    <div class="char-desc" id="charDesc">写真を読み込むと、特徴を継承した「幼少期アバター」が生成されます。</div>
  </div>

  <!-- 対話エリア -->
  <div class="card">
    <h2>💬 今日の頑張りを伝える</h2>
    <input type="text" id="userInput" placeholder="例: 掃除を頑張ったよ！" />
    <button id="sendBtn" onclick="talkToAvatar()" disabled>アバターに伝える</button>
    <div class="chat-box" id="chatBox">報告を待ってるね！</div>
  </div>

  <!-- ログ -->
  <div class="card">
    <h2>
      📜 成長の記録
      <button class="reset-btn" onclick="resetData()">リセット</button>
    </h2>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<script>
  let base64Image = "";
  let avatarTraits = "";
  let rawPromptBase = "";
  let level = 1;
  let currentReply = "";
  let logs = [];

  const apiKeyInput = document.getElementById('apiKey');

  window.onload = () => {
    apiKeyInput.value = localStorage.getItem('avatar_pro_max_v3_key') || '';
    apiKeyInput.addEventListener('change', () => localStorage.setItem('avatar_pro_max_v3_key', apiKeyInput.value.trim()));
    loadData();
  };

  function loadData() {
    const saved = localStorage.getItem('avatar_state_v3');
    if (!saved) return;
    const data = JSON.parse(saved);
    level = data.level || 1;
    avatarTraits = data.traits || '';
    rawPromptBase = data.rawPromptBase || '';
    logs = data.logs || [];
    document.getElementById('charName').innerText = data.name || 'アバター';
    document.getElementById('charDesc').innerText = `特徴: ${avatarTraits}`;
    document.getElementById('avatarImg').src = data.imgUrl || '';
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('setupCard').style.display = 'none';
    updateLevelBadge();
    renderLogs();
  }

  function saveData(imgUrl) {
    const data = {
      level, traits: avatarTraits, rawPromptBase,
      name: document.getElementById('charName').innerText,
      imgUrl: imgUrl || document.getElementById('avatarImg').src,
      logs
    };
    localStorage.setItem('avatar_state_v3', JSON.stringify(data));
  }

  function resetData() {
    if (!confirm("最初からやり直しますか？")) return;
    localStorage.removeItem('avatar_state_v3');
    location.reload();
  }

  // 🖼️ 写真の取り込みとリサイズ（iPhoneの大容量対策）
  function handlePhoto(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        // AIが処理しやすいサイズ（最大800px）にリサイズ
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        const max = 800;
        if (width > height && width > max) { height *= max / width; width = max; }
        else if (height > max) { width *= max / height; height = max; }
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        
        const resizedDataUrl = canvas.toDataURL('image/jpeg', 0.8);
        base64Image = resizedDataUrl.split(',')[1];
        document.getElementById('previewImg').src = resizedDataUrl;
        document.getElementById('previewArea').style.display = 'block';
        document.getElementById('analyzeBtn').style.display = 'block';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function startPhotoAnalysis() {
    const apiKey = apiKeyInput.value.trim();
    if (!apiKey) return alert("APIキーを入力してください");
    const status = document.getElementById('statusMsg');
    const analyzeBtn = document.getElementById('analyzeBtn');
    analyzeBtn.disabled = true;
    status.textContent = "AI分析中...";

    try {
      const mRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
      const mData = await mRes.json();
      const models = mData.models.filter(m => m.supportedGenerationMethods.includes("generateContent")).sort((a,b)=>b.name.localeCompare(a.name));

      const prompt = `この画像の特徴（性別、髪型、メガネ、表情）を分析し、以下のJSON形式のみで返してください。
{
  "name": "特徴を捉えた可愛い子供用ニックネーム",
  "traits": "見た目の特徴を1文で",
  "rawPromptBase": "Detailed English keywords of visual traits (e.g., short hair, glasses)"
}`;

      let success = false;
      for (const m of models) {
        status.textContent = `接続試行: ${m.name.split('/').pop()}...`;
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/${m.name}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: base64Image } }] }]
            })
          });
          const data = await res.json();
          if (res.ok) {
            const result = JSON.parse(data.candidates[0].content.parts[0].text.match(/\{.*\}/s)[0]);
            avatarTraits = result.traits;
            rawPromptBase = result.rawPromptBase;
            document.getElementById('charName').innerText = result.name;
            document.getElementById('charDesc').innerText = `特徴: ${result.traits}`;
            localStorage.setItem('last_avatar_model', m.name);
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('setupCard').style.display = 'none';
            status.textContent = "アバター誕生！";
            await updateAvatarVisual();
            success = true; break;
          }
        } catch (e) { console.error(e); continue; }
      }
      if(!success) alert("AIが写真を解析できませんでした。別の写真で試すか、キーを確認してください。");
    } catch (err) { alert("エラー: " + err.message); }
    finally { analyzeBtn.disabled = false; }
  }

  async function updateAvatarVisual() {
    let agePrompt = "A very cute toddler child";
    if (level >= 3 && level < 6) agePrompt = "A cute school student";
    if (level >= 6) agePrompt = "A mature adult";
    const fullPrompt = `${agePrompt}, ${rawPromptBase}, anime style, clean lines, vibrant colors`;
    const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(fullPrompt)}?width=400&height=400&nologo=true&seed=${Math.floor(Math.random()*1000)}`;
    const avatarEl = document.getElementById('avatarImg');
    avatarEl.src = imgUrl;
    avatarEl.onload = () => saveData(imgUrl);
  }

  function updateLevelBadge() {
    let stage = level < 3 ? "幼少期" : (level < 6 ? "成長期" : "成人期");
    document.getElementById('levelBadge').innerText = `Lv.${level} (${stage})`;
  }

  async function talkToAvatar() {
    const apiKey = apiKeyInput.value.trim();
    const text = document.getElementById('userInput').value.trim();
    if (!text) return;

    const chatBox = document.getElementById('chatBox');
    const sendBtn = document.getElementById('sendBtn');
    sendBtn.disabled = true;
    chatBox.textContent = "考え中...";

    let role = "あなたは幼少期アバターです。言葉足らずで無邪気な子供の口調（『〜だよぉ！』『すごーい！』など）で褒めて。";
    if (level >= 3 && level < 6) role = "あなたは少し成長した少年・少女です。対等な目線で優しく褒めて。";
    if (level >= 6) role = "あなたは立派に成長した大人です。優しく労ってください。";

    try {
      const model = localStorage.getItem('last_avatar_model') || 'models/gemini-1.5-flash';
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/${model}:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: `${role}\nユーザー報告:「${text}」\n2〜3文で返答して。` }] }] })
      });
      const data = await res.json();
      currentReply = data.candidates[0].content.parts[0].text;
      chatBox.innerHTML = `${currentReply}<br><button class="voice-btn" onclick="speak()">🔊 聴く</button>`;
      document.getElementById('userInput').value = "";
      logs.unshift({ user: text, reply: currentReply });
      if (logs.length > 20) logs.pop();
      renderLogs();
      const prevLevel = level;
      level++;
      updateLevelBadge();
      if ((prevLevel < 3 && level >= 3) || (prevLevel < 6 && level >= 6)) await updateAvatarVisual();
      else saveData();
    } catch (e) { chatBox.textContent = "送信エラー。"; }
    finally { sendBtn.disabled = false; }
  }

  function renderLogs() {
    document.getElementById('historyList').innerHTML = logs.map(l => `
      <div class="history-item">
        <div class="history-user">YOU: ${l.user}</div>
        <div>${l.reply}</div>
      </div>`).join('');
  }

  function speak() {
    if (!currentReply) return;
    window.speechSynthesis.cancel();
    const uttr = new SpeechSynthesisUtterance(currentReply);
    uttr.lang = 'ja-JP';
    uttr.rate = 1.1;
    uttr.pitch = level < 3 ? 1.7 : (level < 6 ? 1.2 : 0.9);
    window.speechSynthesis.speak(uttr);
  }
</script>

</body>
</html>
