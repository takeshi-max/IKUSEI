<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>幼少期アバター育成 Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 16px; display: flex; justify-content: center; }
    .app-container { max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 14px; }
    .card { background: #1e293b; border-radius: 20px; padding: 18px; border: 1px solid #334155; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
    h2 { font-size: 15px; margin-bottom: 12px; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    
    /* アバター表示 */
    .avatar-card { text-align: center; background: radial-gradient(circle at 50% 0%, #1e293b, #0f172a); border: 2px solid #38bdf8; position: relative; }
    .avatar-box { width: 140px; height: 140px; border-radius: 50%; background: #000; margin: 0 auto 12px; overflow: hidden; border: 4px solid #38bdf8; display: flex; align-items: center; justify-content: center; position: relative; box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
    #avatarImg { width: 100%; height: 100%; object-fit: cover; }
    .level-badge { position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); background: #38bdf8; color: #0f172a; font-weight: 900; font-size: 12px; padding: 4px 12px; border-radius: 12px; white-space: nowrap; }
    
    .char-name { font-size: 20px; font-weight: bold; margin-top: 10px; color: #fff; }
    .char-desc { font-size: 12px; color: #94a3b8; margin-top: 6px; line-height: 1.4; padding: 0 10px; }

    /* 入力エリア */
    input[type="password"], input[type="text"] { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #475569; background: #030712; color: white; font-size: 14px; outline: none; margin-bottom: 10px; }
    button { width: 100%; padding: 16px; background: #38bdf8; color: #0f172a; border: none; border-radius: 14px; font-weight: 800; cursor: pointer; font-size: 14px; transition: 0.2s; box-shadow: 0 4px 0 #0284c7; }
    button:active { transform: translateY(2px); box-shadow: none; }
    button:disabled { background: #334155; color: #64748b; box-shadow: none; }
    
    .chat-box { background: #030712; border-radius: 16px; padding: 15px; min-height: 100px; font-size: 15px; line-height: 1.6; color: #e5e7eb; border: 1px solid #1f2937; position: relative; }
    .voice-btn { width: auto; padding: 8px 15px; font-size: 12px; background: #6366f1; position: absolute; bottom: 10px; right: 10px; box-shadow: 0 3px 0 #4338ca; }
    
    #previewArea { display: none; margin-bottom: 10px; position: relative; }
    #previewImg { width: 100%; height: 120px; object-fit: cover; border-radius: 12px; filter: grayscale(0.5); opacity: 0.7; }
    .status-msg { font-size: 10px; color: #4b5563; text-align: center; margin-top: 8px; min-height: 1.2em; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="card">
    <input type="password" id="apiKey" placeholder="Gemini API Key を入力" />
    <div id="statusMsg" class="status-msg"></div>
  </div>

  <div class="card">
    <h2>📸 元の写真からアバター生成</h2>
    <div id="previewArea">
      <img id="previewImg" alt="元画像" />
    </div>
    <input type="file" id="photoInput" accept="image/*" style="display:none;" onchange="handlePhoto(event)" />
    <button onclick="document.getElementById('photoInput').click()">📸 写真を選択（自分など）</button>
    <button id="analyzeBtn" onclick="startPhotoAnalysis()" style="display:none; margin-top:10px; background:#10b981; box-shadow:0 4px 0 #047857;">✨ アバター化開始</button>
  </div>

  <div class="card avatar-card">
    <div class="avatar-box">
      <img id="avatarImg" src="https://image.pollinations.ai/prompt/cute%20anime%20child%20avatar%20silhouette?width=300&height=300&nologo=true" alt="アバター" />
      <div class="level-badge" id="levelBadge">Lv.1 (幼少期)</div>
    </div>
    <div class="char-name" id="charName">あなたのアバター</div>
    <div class="char-desc" id="charDesc">写真を読み込むと、AIがあなたの特徴を継承した「幼少期アバター」を生成します。</div>
  </div>

  <div class="card">
    <h2>💬 今日の頑張りを伝える</h2>
    <input type="text" id="userInput" placeholder="例: 苦手な電話を1本かけた！" />
    <button id="sendBtn" onclick="talkToAvatar()" disabled>アバターに伝える (EXP UP)</button>
    <div class="chat-box" id="chatBox" style="margin-top:15px;">
      メッセージを待っているよ！
    </div>
  </div>
</div>

<script>
  let base64Image = "";
  let avatarTraits = "";
  let level = 1;
  let currentReply = "";

  const apiKeyInput = document.getElementById('apiKey');
  apiKeyInput.value = localStorage.getItem('avatar_pro_key') || '';
  apiKeyInput.addEventListener('change', () => localStorage.setItem('avatar_pro_key', apiKeyInput.value.trim()));

  function handlePhoto(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      base64Image = e.target.result.split(',')[1];
      document.getElementById('previewImg').src = e.target.result;
      document.getElementById('previewArea').style.display = 'block';
      document.getElementById('analyzeBtn').style.display = 'block';
    };
    reader.readAsDataURL(file);
  }

  async function startPhotoAnalysis() {
    const apiKey = apiKeyInput.value.trim();
    if (!apiKey) return alert("APIキーを入力してください");
    const status = document.getElementById('statusMsg');
    const analyzeBtn = document.getElementById('analyzeBtn');
    analyzeBtn.disabled = true;
    status.textContent = "AIモデルを探査中...";

    try {
      const mRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
      const mData = await mRes.json();
      const models = mData.models.filter(m => m.supportedGenerationMethods.includes("generateContent")).sort((a,b)=>b.name.localeCompare(a.name));
      const lastModel = localStorage.getItem('last_avatar_model') || models[0].name;

      const prompt = `この画像の特徴（性別、髪型、目元、メガネの有無、表情）を分析し、以下のJSON形式でのみ返してください。
{
  "name": "可愛い幼少期風ニックネーム",
  "traits": "見た目の特徴を1文で",
  "imagePrompt": "A very cute childhood version of the person in photo, anime style, big expressive eyes, maintaining key traits like hair style and glasses, bright warm lighting, 4k"
}`;

      let success = false;
      for (const m of models) {
        status.textContent = `${m.name.split('/').pop()} で分析中...`;
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/${m.name}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: base64Image } }] }]
            })
          });
          const data = await res.json();
          if (res.ok) {
            const result = JSON.parse(data.candidates[0].content.parts[0].text.replace(/```json|```/g, "").trim());
            
            // アバター情報の更新
            avatarTraits = result.traits;
            document.getElementById('charName').innerText = result.name;
            document.getElementById('charDesc').innerText = `特徴: ${result.traits}`;
            
            // 画像生成 (Pollinations)
            const finalImgPrompt = encodeURIComponent(result.imagePrompt);
            document.getElementById('avatarImg').src = `https://image.pollinations.ai/prompt/${finalImgPrompt}?width=400&height=400&nologo=true&seed=${Math.floor(Math.random()*1000)}`;

            localStorage.setItem('last_avatar_model', m.name);
            document.getElementById('sendBtn').disabled = false;
            status.textContent = "アバターが誕生しました！";
            success = true; break;
          }
        } catch (e) { console.warn(m.name, e); continue; }
      }
    } catch (err) { alert("エラー: " + err.message); }
    finally { analyzeBtn.disabled = false; }
  }

  async function talkToAvatar() {
    const apiKey = apiKeyInput.value.trim();
    const text = document.getElementById('userInput').value.trim();
    if (!text) return;

    const chatBox = document.getElementById('chatBox');
    const sendBtn = document.getElementById('sendBtn');
    sendBtn.disabled = true;
    chatBox.textContent = "考え中...";

    const role = level < 3 
      ? "あなたはユーザーの幼少期アバターです。無邪気で天真爛漫、語尾は『〜だよ！』『〜だね！』を使い、100%肯定して可愛く褒めてください。" 
      : "あなたは少し成長した少年・少女です。少し背伸びした口調で、対等な目線で優しく頼もしく褒めてください。";

    const prompt = `${role}\n見た目の特徴: ${avatarTraits}\nユーザーの報告: 「${text}」\n2〜3文で元気づける返答を。`;

    try {
      const model = localStorage.getItem('last_avatar_model');
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/${model}:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
      });
      const data = await res.json();
      currentReply = data.candidates[0].content.parts[0].text;
      
      chatBox.innerHTML = `${currentReply}<br><button class="voice-btn" onclick="speak()">🔊 聴く</button>`;
      document.getElementById('userInput').value = "";

      // レベルアップ
      level++;
      document.getElementById('levelBadge').innerText = `Lv.${level} (${level < 3 ? '幼少期' : '成長期'})`;
      
    } catch (e) { chatBox.textContent = "送信エラー"; }
    finally { sendBtn.disabled = false; }
  }

  function speak() {
    if (!currentReply) return;
    window.speechSynthesis.cancel();
    const uttr = new SpeechSynthesisUtterance(currentReply);
    uttr.lang = 'ja-JP';
    uttr.rate = 1.2;
    uttr.pitch = level < 3 ? 1.6 : 1.1; // 幼少期は声を高く
    window.speechSynthesis.speak(uttr);
  }
</script>

</body>
</html>
