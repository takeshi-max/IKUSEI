<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>歩いて育てる幼少期アバター Pro Max</title>

  <!-- PWA設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" id="manifestLink">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 16px; display: flex; justify-content: center; }
    .app-container { max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 14px; padding-bottom: 40px; }
    .card { background: #1e293b; border-radius: 20px; padding: 18px; border: 1px solid #334155; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
    h2 { font-size: 14px; margin-bottom: 10px; color: #38bdf8; display: flex; align-items: center; justify-content: space-between; }
    
    .avatar-card { text-align: center; background: radial-gradient(circle at 50% 0%, #1e293b, #0f172a); border: 2px solid #38bdf8; position: relative; padding-top: 30px; }
    .avatar-box { width: 150px; height: 150px; border-radius: 50%; background: #000; margin: 0 auto 12px; overflow: hidden; border: 4px solid #38bdf8; display: flex; align-items: center; justify-content: center; position: relative; box-shadow: 0 0 25px rgba(56, 189, 248, 0.5); }
    #avatarImg { width: 100%; height: 100%; object-fit: cover; }
    .level-badge { position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); background: #38bdf8; color: #0f172a; font-weight: 900; font-size: 12px; padding: 4px 12px; border-radius: 12px; white-space: nowrap; z-index: 10; }
    
    .char-name { font-size: 24px; font-weight: bold; margin-top: 10px; color: #fff; }
    .next-goal { font-size: 11px; color: #fbbf24; margin-top: 8px; font-weight: bold; }
    .exp-bar-bg { width: 100%; height: 8px; background: #0f172a; border-radius: 4px; border: 1px solid #334155; margin-top: 10px; }
    .exp-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #38bdf8, #818cf8); transition: width 0.5s ease; }

    .step-count { font-size: 42px; font-weight: 900; color: #818cf8; text-align: center; margin: 10px 0; }
    input[type="password"], input[type="text"] { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #475569; background: #030712; color: white; font-size: 15px; outline: none; margin-bottom: 10px; }
    .main-btn { width: 100%; padding: 16px; background: #38bdf8; color: #0f172a; border: none; border-radius: 14px; font-weight: 800; cursor: pointer; font-size: 15px; box-shadow: 0 4px 0 #0284c7; }
    .main-btn:active { transform: translateY(2px); box-shadow: none; }
    .chat-box { background: #030712; border-radius: 16px; padding: 18px; font-size: 15px; line-height: 1.6; border: 1px solid #38bdf8; margin-top: 15px; display: none; }
    .history-list { max-height: 150px; overflow-y: auto; margin-top: 10px; }
    .history-item { background: #0f172a; border-radius: 10px; padding: 10px; font-size: 12px; margin-bottom: 8px; border-left: 3px solid #38bdf8; }
    .reset-btn { background: transparent; color: #64748b; border: none; font-size: 10px; cursor: pointer; }
    #manualTraits { display: none; margin-bottom: 10px; }
  </style>
</head>
<body onclick="autoInitSensor()">

<div class="app-container">
  <div class="card" style="padding: 10px 18px;">
    <input type="password" id="apiKey" placeholder="Gemini API Key" style="margin-bottom:0; font-size:10px; padding:8px;" />
  </div>

  <!-- 誕生エリア -->
  <div class="card" id="setupCard">
    <h2 style="margin-bottom:15px;">📸 あなたの子供時代を生成</h2>
    <input type="text" id="userName" placeholder="あなたのお名前" />
    
    <!-- 写真からか、特徴入力か選べるように変更 -->
    <div id="previewArea" style="display:none;"><img id="previewImg" style="width:100%; border-radius:12px; margin-bottom:10px;" /></div>
    <input type="file" id="photoInput" accept="image/*" style="display:none;" onchange="handlePhoto(event)" />
    
    <button class="main-btn" onclick="document.getElementById('photoInput').click()">📸 写真を選択して誕生</button>
    <div style="text-align:center; margin:10px 0; color:#64748b; font-size:11px;">または</div>
    <button class="main-btn" style="background:#475569; box-shadow:0 4px 0 #334155;" onclick="toggleManualMode()">✏️ 特徴を自分で入力して誕生</button>
    
    <div id="manualTraits">
      <input type="text" id="traitsInput" placeholder="例：黒髪、短髪、メガネ、優しそうな目" />
      <button class="main-btn" style="background:#10b981; box-shadow:0 4px 0 #047857;" onclick="startAnalysis(true)">✨ この特徴で誕生させる</button>
    </div>

    <button id="analyzeBtn" class="main-btn" onclick="startAnalysis(false)" style="display:none; margin-top:10px; background:#10b981;">✨ 写真から誕生させる</button>
  </div>

  <!-- ステータスエリア -->
  <div class="card avatar-card">
    <div class="avatar-box"><img id="avatarImg" src="https://image.pollinations.ai/prompt/cute%20anime%20child%20silhouette?width=300&height=300&nologo=true" />
      <div class="level-badge" id="levelBadge">Lv.1 (未誕生)</div>
    </div>
    <div class="char-name" id="charName">---</div>
    <div id="nextGoal" class="next-goal">名前と写真を準備してね！</div>
    <div class="exp-bar-bg"><div class="exp-bar-fill" id="expFill"></div></div>
  </div>

  <!-- 歩数エリア -->
  <div class="card pedometer-card">
    <div class="step-count" id="stepDisplay">0 <span style="font-size:16px;">歩</span></div>
    <button id="stepReportBtn" class="main-btn" onclick="reportStepsToAvatar()" style="background:#6366f1;" disabled>歩数を報告して成長させる</button>
  </div>

  <div class="card">
    <div class="input-group" style="display:flex; gap:8px;">
      <input type="text" id="userInput" placeholder="メッセージを入力..." style="flex:1; margin-bottom:0;" />
      <button onclick="talkToAvatar()" id="talkBtn" style="width:60px; border-radius:12px; background:#38bdf8; border:none; font-size:18px;">💬</button>
    </div>
    <div class="chat-box" id="chatBox"></div>
  </div>

  <div class="card">
    <h2 style="font-size:12px;">📜 思い出ログ <button class="reset-btn" onclick="resetData()">リセット</button></h2>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<script>
  let base64Image = "", avatarTraits = "", rawPromptBase = "", level = 1, exp = 0;
  const maxExpPerLevel = 100;
  let stepCount = 0, currentReply = "", logs = [], sensorInitialized = false, lastAccel = { x: 0, y: 0, z: 0 };

  window.onload = () => {
    document.getElementById('apiKey').value = localStorage.getItem('avatar_rescue_key') || '';
    document.getElementById('apiKey').addEventListener('change', (e) => localStorage.setItem('avatar_rescue_key', e.target.value.trim()));
    loadData();
  };

  async function autoInitSensor() {
    if (sensorInitialized) return;
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      try { const res = await DeviceMotionEvent.requestPermission(); if (res === 'granted') { window.addEventListener('devicemotion', handleMotion); sensorInitialized = true; } } catch (e) {}
    } else { window.addEventListener('devicemotion', handleMotion); sensorInitialized = true; }
  }

  function handleMotion(event) {
    const accel = event.accelerationIncludingGravity; if (!accel) return;
    const delta = Math.abs(accel.x - lastAccel.x) + Math.abs(accel.y - lastAccel.y) + Math.abs(accel.z - lastAccel.z);
    if (delta > 13) { stepCount++; document.getElementById('stepDisplay').innerHTML = `${stepCount} <span style="font-size:16px;">歩</span>`; updateNextGoal(); }
    lastAccel = { x: accel.x, y: accel.y, z: accel.z };
  }

  function toggleManualMode() { document.getElementById('manualTraits').style.display = 'block'; }

  function handlePhoto(event) {
    const file = event.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const max = 200; // 徹底的に軽量化！
        let w = img.width, h = img.height;
        if (w > h) { h *= max / w; w = max; } else { w *= max / h; h = max; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        base64Image = canvas.toDataURL('image/jpeg', 0.4).split(',')[1];
        document.getElementById('previewImg').src = canvas.toDataURL('image/jpeg');
        document.getElementById('previewArea').style.display = 'block';
        document.getElementById('analyzeBtn').style.display = 'block';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function startAnalysis(isManual) {
    const userName = document.getElementById('userName').value.trim();
    const apiKey = document.getElementById('apiKey').value.trim();
    if (!userName || !apiKey) return alert("名前とAPIキーを確認してね！");
    const statusMsg = document.getElementById('statusMsg');
    
    try {
      // 使えるモデルを探す
      const mRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
      const mData = await mRes.json();
      const models = mData.models.filter(m => m.supportedGenerationMethods.includes("generateContent")).sort((a,b)=>b.name.localeCompare(a.name));
      const model = models.find(m => m.name.includes("flash"))?.name || models[0].name;

      let prompt = "";
      let contents = [];

      if (isManual) {
        // 文字だけで誕生（制限回避）
        const traits = document.getElementById('traitsInput').value.trim();
        prompt = `名前「${userName}」と特徴「${traits}」から、可愛い子供時代のアバター（ひらがな愛称）をJSONで作って。{"name":"なまえ","traits":"特徴","rawPromptBase":"English visual description"}`;
        contents = [{ parts: [{ text: prompt }] }];
      } else {
        // 写真で誕生
        prompt = `画像の本人の「面影」を維持した幼少期アバター（ひらがな愛称）をJSONで作って。名前は「${userName}」をもじって。{"name":"なまえ","traits":"特徴","rawPromptBase":"English description"}`;
        contents = [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: base64Image } }] }];
      }

      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/${model}:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: contents })
      });
      const data = await res.json();
      
      if (res.ok && data.candidates) {
        const result = JSON.parse(data.candidates[0].content.parts[0].text.match(/\{.*\}/s)[0]);
        avatarTraits = result.traits; rawPromptBase = result.rawPromptBase;
        document.getElementById('charName').innerText = result.name.includes('なまえ') ? userName + "ぴ" : result.name;
        document.getElementById('setupCard').style.display = 'none';
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('stepReportBtn').disabled = false;
        localStorage.setItem('working_model_rescue', model);
        updateLevelAndExp(); await updateAvatarVisual();
      } else {
        throw new Error(data.error?.message || "制限エラー");
      }
    } catch (err) {
      alert("制限により写真を分析できませんでした。「特徴を自分で入力」モードをお試しください。");
    }
  }

  async function updateAvatarVisual() {
    let age = level < 11 ? "tiny toddler" : (level < 31 ? "cute primary student" : "mature young adult");
    const fullPrompt = `${age} anime version of person with ${rawPromptBase}, RETAIN IDENTITY, looking at viewer, high quality, soft lighting`;
    const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(fullPrompt)}?width=400&height=400&nologo=true&seed=${Math.floor(Math.random()*1000)}`;
    document.getElementById('avatarImg').src = imgUrl; 
    document.getElementById('avatarImg').onload = () => saveData(imgUrl);
  }

  function updateNextGoal() {
    const stepsNeeded = Math.max(0, (maxExpPerLevel - exp) * 500 - stepCount * 5);
    document.getElementById('nextGoal').innerText = `進化まで あと約 ${stepsNeeded} 歩`;
  }

  function addExp(gained) {
    exp += gained; const prev = level;
    while (exp >= maxExpPerLevel) { exp -= maxExpPerLevel; level++; }
    updateLevelAndExp(); updateNextGoal();
    if ((prev < 11 && level >= 11) || (prev < 31 && level >= 31)) updateAvatarVisual(); else saveData();
  }

  function updateLevelAndExp() {
    const stages = level < 11 ? "幼少期" : (level < 31 ? "成長期" : "成人期");
    document.getElementById('levelBadge').innerText = `Lv.${level} (${stages})`;
    document.getElementById('expFill').style.width = `${(exp / maxExpPerLevel) * 100}%`;
  }

  async function reportStepsToAvatar() {
    if (stepCount < 100) return alert("もっと歩いてから報告してね！");
    const steps = stepCount; stepCount = 0;
    document.getElementById('stepDisplay').innerHTML = `0 <span style="font-size:16px;">歩</span>`;
    addExp(Math.floor(steps / 500));
    await processAvatarMessage(`今日はお散歩して ${steps} 歩も歩いたよ！`, 0);
  }

  async function talkToAvatar() {
    const text = document.getElementById('userInput').value.trim();
    if (!text) return;
    document.getElementById('userInput').value = "";
    await processAvatarMessage(text, 2);
  }

  async function processAvatarMessage(text, gainedExp) {
    const chatBox = document.getElementById('chatBox');
    chatBox.style.display = "block"; chatBox.textContent = "AI思考中...";
    const role = level < 11 ? "幼い子供" : (level < 31 ? "少年・少女" : "大人のパートナー");
    const prompt = `あなたは「${role}」になりきり、セリフのみ出力。二文以内。報告:「${text}」`;
    try {
      const apiKey = document.getElementById('apiKey').value.trim();
      const model = localStorage.getItem('working_model_rescue') || "gemini-1.5-flash";
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/${model}:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
      });
      const data = await res.json();
      let reply = data.candidates[0].content.parts[0].text;
      currentReply = reply.split('\n').pop().trim();
      chatBox.innerHTML = `${currentReply}<br><button class="voice-btn" onclick="speak()">🔊 聴く</button>`;
      logs.unshift({ user: text, reply: currentReply }); if (logs.length > 15) logs.pop();
      renderLogs(); if (gainedExp > 0) addExp(gainedExp);
    } catch (e) { chatBox.textContent = "エラー。"; }
  }

  function renderLogs() {
    document.getElementById('historyList').innerHTML = logs.map(l => `<div class="history-item"><div style="color:#94a3b8; font-weight:bold;">YOU: ${l.user}</div><div>${l.reply}</div></div>`).join('');
  }

  function speak() {
    if (!currentReply) return;
    window.speechSynthesis.cancel();
    const uttr = new SpeechSynthesisUtterance(currentReply);
    uttr.lang = 'ja-JP'; uttr.rate = 1.1;
    uttr.pitch = level < 11 ? 1.7 : (level < 31 ? 1.2 : 0.9);
    window.speechSynthesis.speak(uttr);
  }

  function loadData() {
    const saved = localStorage.getItem('avatar_rescue_v1');
    if (!saved) return;
    const data = JSON.parse(saved);
    level = data.level || 1; exp = data.exp || 0; avatarTraits = data.traits || ''; rawPromptBase = data.rawPromptBase || ''; logs = data.logs || [];
    document.getElementById('charName').innerText = data.name; document.getElementById('avatarImg').src = data.imgUrl;
    document.getElementById('setupCard').style.display = 'none';
    document.getElementById('sendBtn').disabled = false; document.getElementById('stepReportBtn').disabled = false;
    updateLevelAndExp(); renderLogs(); updateNextGoal();
  }

  function saveData(imgUrl) {
    localStorage.setItem('avatar_rescue_v1', JSON.stringify({ level, exp, traits: avatarTraits, rawPromptBase, name: document.getElementById('charName').innerText, imgUrl: imgUrl || document.getElementById('avatarImg').src, logs }));
  }

  function resetData() { if (confirm("リセットしますか？")) { localStorage.removeItem('avatar_rescue_v1'); location.reload(); } }
</script>
</body>
</html>
